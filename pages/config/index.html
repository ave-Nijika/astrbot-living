<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>living 配置面板</title>
  <link rel="stylesheet" href="./style.css">
  <!-- AstrBot Pages bridge SDK（自动携带 dashboard 鉴权） -->
  <script src="/api/plugin/page/bridge-sdk.js"></script>
</head>
<body>
  <header class="toolbar">
    <div class="toolbar-left">
      <h1>living 配置面板</h1>
      <span id="save-state" class="save-state"></span>
    </div>
    <div class="tabs" role="tablist">
      <button id="tab-novice" class="tab active" type="button" role="tab">新手</button>
      <button id="tab-expert" class="tab" type="button" role="tab">专家</button>
    </div>
    <div class="toolbar-actions">
      <button id="btn-save" class="btn primary" type="button">💾 保存改动</button>
      <button id="btn-reset" class="btn danger" type="button">↩ 恢复默认值</button>
    </div>
  </header>

  <main>
    <!-- M25-补丁1 C8：全局状态行——AstrBot 现在会主动做的事（七条出口各带状态，
      两个视图共用；由 app.js renderGlobalStatus 按 panel_layout.json exits 求值） -->
    <div id="global-status" class="global-status hidden"></div>

    <!-- 新手视图：M25-补丁1 配套 a——首层 8 张旋钮按一级栏目归组 +
      生活背景参考；13 张功能卡进「细项」折叠区 -->
    <section id="view-novice" class="view" role="tabpanel">
      <div id="novice-cards" class="card-grid"></div>
      <div id="novice-life" class="life-box"></div>
    </section>

    <!-- 专家视图：M25-补丁1 C3——按 _layout 树渲染（一级域/二级功能/三级键），
      四态状态点、生效链、级联置灰与组计数；无布局时回退旧扁平渲染 -->
    <section id="view-expert" class="view hidden" role="tabpanel">
      <p class="expert-note">
        专家区：默认值即保守安全值。带 <span class="danger-chip">⚠ 危险</span>
        标记的项改错会导致它作息失序或烧钱，不确定就别动。
        状态点：<span class="status-dot st-active">● 开</span>真的在生效｜
        <span class="status-dot st-off">● 关</span>显式关闭｜
        <span class="status-dot st-blocked">▲ 卡着</span>开关开了但前置不满足｜
        <span class="status-dot st-dead">● 哑</span>被上游关闭级联。
      </p>
      <div id="expert-groups" class="drawer-list"></div>
      <!-- 心境与兴趣（M9-补丁1 B5/B6）：M25-补丁1 起并入「AstrBot 的记忆」区（（附）），
        容器由 renderExpert 在 G 区动态创建 -->
    </section>

    <p id="load-error" class="load-error hidden"></p>
  </main>

  <!-- 页内确认弹层（Pages 沙箱禁用 confirm/alert/prompt） -->
  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <p id="modal-text"></p>
      <div class="modal-actions">
        <button id="modal-cancel" class="btn" type="button">取消</button>
        <button id="modal-ok" class="btn danger" type="button">确认</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
