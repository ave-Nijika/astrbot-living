[pytest]
# M8-补丁1：测试基建哨兵与范围防呆
#
# 1) testpaths：限定收集范围到 tests/。裸 `pytest` 会递归收集 scripts/
#    下的调试脚本（如 test_thinking.py，模块级联网调用 + 替换 stdout），
#    导致收集阶段挂死；显式传路径（pytest tests/）不受影响。
# 2) filterwarnings：把"后台线程未处理异常"升级为测试失败。aiosqlite
#    连接未在所属 loop 关闭前 close 时，后台线程会向已关 loop 投递
#    （Event loop is closed）——这是 M8-补丁1 修复的间歇失败载体，
#    以 warning 形态存在时被当作噪音，升级为 error 后即成失败信号。
#    google.genai 的 DeprecationWarning 与本插件无关，不在此列。
testpaths = tests
filterwarnings =
    error::pytest.PytestUnhandledThreadExceptionWarning
